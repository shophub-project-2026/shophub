{{define "nav"}}
<nav class="bg-white border-b border-gray-100">
  <div class="max-w-5xl mx-auto px-6 py-3 flex items-center justify-between">
    <a href="/dashboard" class="flex items-center gap-2 font-bold text-indigo-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
      ShopHub
    </a>
    <div class="flex items-center gap-5">
      <span class="text-sm text-gray-500">{{.Email}}</span>
      <a href="/logout" class="text-sm text-gray-500 hover:text-red-500 transition-colors">Sign out</a>
    </div>
  </div>
</nav>
{{end}}

{{define "phasebadge"}}
  {{if eq . "Running"}}
    <span class="inline-flex items-center gap-1 bg-green-50 text-green-700 text-xs font-medium px-2 py-0.5 rounded-full">
      <span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span>Running
    </span>
  {{else if eq . "Pending"}}
    <span class="inline-flex items-center gap-1 bg-yellow-50 text-yellow-700 text-xs font-medium px-2 py-0.5 rounded-full">
      <span class="w-1.5 h-1.5 bg-yellow-400 rounded-full"></span>Pending
    </span>
  {{else if eq . "Provisioning"}}
    <span class="inline-flex items-center gap-1 bg-blue-50 text-blue-700 text-xs font-medium px-2 py-0.5 rounded-full">
      <span class="w-1.5 h-1.5 bg-blue-400 rounded-full"></span>Provisioning
    </span>
  {{else}}
    <span class="inline-flex items-center gap-1 bg-gray-100 text-gray-600 text-xs font-medium px-2 py-0.5 rounded-full">
      <span class="w-1.5 h-1.5 bg-gray-400 rounded-full"></span>{{if .}}{{.}}{{else}}Unknown{{end}}
    </span>
  {{end}}
{{end}}
