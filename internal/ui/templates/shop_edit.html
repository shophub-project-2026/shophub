<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopHub — Edit {{.Shop.Name}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50">
  {{template "nav" .}}
  <main class="max-w-2xl mx-auto px-6 py-8">
    <div class="mb-6">
      <a href="/shops/{{.Shop.Name}}" class="text-sm text-gray-500 hover:text-indigo-600 flex items-center gap-1 mb-4">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Back to shop
      </a>
      <h1 class="text-xl font-bold text-gray-900">Edit {{.Shop.Name}}</h1>
      <p class="text-sm text-gray-500 mt-0.5">Changes are applied directly to the Kubernetes CRD</p>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 p-6">
      {{if .Error}}
      <div class="bg-red-50 border border-red-100 text-red-600 rounded-lg px-4 py-3 mb-5 text-sm">{{.Error}}</div>
      {{end}}
      <form method="POST" action="/shops/{{.Shop.Name}}/edit" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Availability</label>
          <select name="availability"
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent bg-white">
            <option value="standard" {{if eq .Shop.Availability "standard"}}selected{{end}}>Standard (2 replike)</option>
            <option value="high" {{if eq .Shop.Availability "high"}}selected{{end}}>High (3 replike)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Wallet address</label>
          <input type="text" name="walletAddress" required value="{{.Shop.WalletAddress}}"
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        </div>
        <div class="flex gap-3 pt-2">
          <button type="submit"
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2 rounded-lg text-sm transition-colors">
            Save changes
          </button>
          <a href="/shops/{{.Shop.Name}}"
            class="text-gray-600 hover:text-gray-800 font-medium px-5 py-2 rounded-lg text-sm border border-gray-200 hover:border-gray-300 transition-colors">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
